name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Our compose file uses Chainguard MinIO images that need command arguments,
      # which GitHub service containers cannot pass, so start the real stack instead.
      - name: Start Postgres and MinIO
        working-directory: .
        run: |
          docker compose up -d postgres minio
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U fitcoach -d fitcoach && break
            sleep 2
          done
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Migrate and check for model drift
        run: |
          alembic upgrade head
          alembic check

      - name: Test
        run: pytest -q

      - name: Stop services
        if: always()
        working-directory: .
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001
