services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fitcoach
      POSTGRES_PASSWORD: fitcoach
      POSTGRES_DB: fitcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The official minio/minio images are no longer published on Docker Hub/quay,
  # so we use the maintained Chainguard builds of MinIO server and client.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the PRIVATE bucket "fitcoach" (buckets are private by default; no
  # anonymous policy is ever set). Retries until MinIO accepts connections.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["mc"]
    command: ["mb", "--ignore-existing", "local/fitcoach"]
    restart: on-failure

volumes:
  pgdata:
  miniodata:
