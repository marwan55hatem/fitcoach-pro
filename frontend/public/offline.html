<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1116" />
    <title>FitCoach PRO: offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e1116;
        color: #e9edf2;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #8d97a5; margin: 4px 0; }
      button {
        margin-top: 20px;
        background: #ff5a36;
        color: #0e1116;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Connect to the internet to load your coach.</p>
      <p dir="rtl" lang="ar">انت أوفلاين. اتصل بالنت عشان الكوتش يفتح.</p>
      <button onclick="location.reload()">Try again / جرّب تاني</button>
    </main>
  </body>
</html>
